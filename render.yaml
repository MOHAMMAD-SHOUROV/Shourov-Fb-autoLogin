services:
  - type: web
    name: shourov-fb-autologin
    env: node
    region: singapore
    plan: free
    buildCommand: bash -c 'set -e; npm config set prefix ~/.npm-global; npm install -g pnpm@10; export PATH="$HOME/.npm-global/bin:$PATH"; pnpm install --frozen-lockfile; BASE_PATH=/ pnpm --filter @workspace/fb-extension-page run build; pnpm --filter @workspace/api-server run build'
    startCommand: node --max-old-space-size=512 artifacts/api-server/dist/index.mjs
    healthCheckPath: /api/healthz
    envVars:
      - key: NODE_ENV
        value: production
      - key: BASE_PATH
        value: /
      - key: PORT
        value: "10000"
      - key: SESSION_SECRET
        generateValue: true
      - key: ADMIN_PASSWORD
        sync: false
      - key: API_BASE_URL
        sync: false
